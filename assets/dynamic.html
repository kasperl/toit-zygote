<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dynamic WiFi Settings</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>Configure WiFi</h1>
    <form action="/" method="POST">
      <label for="ssid">Network Name (SSID):</label>
      <input type="text" id="ssid" name="ssid" required autocorrect="off" autocapitalize="none">
      
      <label for="password">Password:</label>
      <input type="password" id="password" name="password" autocorrect="off" autocapitalize="none">
      
      <input type="submit" value="Connect">
    </form>

    <div class="networks-section">
      <h2>Available Networks</h2>
      <button type="button" id="refresh-btn">Refresh List</button>
      <ul id="network-list" class="network-list-dynamic">
        <li>Loading...</li>
      </ul>
      <p><small>(Note: reloading the page or clicking refresh fetches the cached scan results from the portal start).</small></p>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
